name: Quality Check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Setup uv (The modern way)
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true      # Automatically caches your Python dependencies
          version: "latest"

      - name: Setup Python
        run: uv python install 3.12

      - name: Sync Python dependencies
        run: uv sync --group dev

      # 2. Install C++ tooling
      - name: Install clang-format, clang-tidy, pybind11
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy pybind11-dev

      # 3. C++ Format Check (non-mutating)
      - name: C++ clang-format check
        run: |
          clang-format --dry-run --Werror $(git ls-files "*.cpp")

      # 4. Configure CMake for clang-tidy (generates compile_commands.json)
      - name: Configure CMake for analysis
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DHADRONIS_ENABLE_SIMD=ON

      # 5. C++ static analysis with clang-tidy
      - name: C++ clang-tidy
        run: clang-tidy $(git ls-files "*.cpp") -p build

      # 6. Python Quality Checks (Using uv run)
      - name: Python Linting & Format Check
        run: |
          uv run ruff check python/
          uv run ruff format --check python/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Setup Python
        run: uv python install 3.12

      - name: Sync Python dependencies
        run: uv sync --group dev

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pybind11-dev clang llvm

      - name: Run Python tests
        run: uv run pytest tests/ --durations=5

      - name: Configure CMake with coverage flags (Clang)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fprofile-instr-generate -fcoverage-mapping" \
            -DCMAKE_EXE_LINKER_FLAGS="-fprofile-instr-generate" \
            -DHADRONIS_ENABLE_SIMD=ON

      - name: Build C++ tests (coverage)
        run: cmake --build build --config Debug

      - name: Run C++ tests with coverage
        env:
          # ctest runs with --test-dir build, so we write profiles into that
          # directory directly and later merge from build/coverage-*.profraw.
          LLVM_PROFILE_FILE: coverage-%p.profraw
        run: ctest --test-dir build --output-on-failure

      - name: Merge coverage profiles
        run: |
          cd build
          if ls tests/coverage-*.profraw 1> /dev/null 2>&1; then
            llvm-profdata merge \
              --sparse tests/coverage-*.profraw \
              -o coverage.profdata
          else
            echo "No coverage profiles found in tests/, skipping merge"
          fi

      - name: Export C++ coverage to lcov
        run: |
          if [ -f build/coverage.profdata ]; then
            llvm-cov export \
              build/tests/hadronis_gtest \
              --instr-profile=build/coverage.profdata \
              --format=lcov \
              --ignore-filename-regex='(/usr/|_deps/|tests/)' \
              > coverage.info
          else
            echo "No coverage.profdata found, skipping coverage export"
            # Create an empty coverage file so Codecov step still runs
            echo "TN:Hadronis" > coverage.info
          fi

      - name: Upload C++ coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.info
          fail_ci_if_error: false
          flags: cpp
          name: cpp-coverage
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Install build tooling
        run: |
          uv python install 3.12
          uv sync --group dev
          uv pip install twine

      - name: Build wheel and sdist
        run: uv run python -m build

      - name: Check built artifacts metadata
        run: uv run twine check dist/*
